concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


name: Refresh sector metrics

# Computes the sector-rotation panel after the daily US/KR price refresh has
# completed. The script reads existing daily bars only; it makes no provider
# calls and is safe to rerun for the same day.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: sector-metrics-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Compute sector returns
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Compute sector metrics
        working-directory: api
        env:
          APP_ENV: prod
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python ../scripts/ingest_sector_metrics.py
